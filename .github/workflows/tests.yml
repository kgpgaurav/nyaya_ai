name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: nyaya
          POSTGRES_PASSWORD: nyaya
          POSTGRES_DB: nyaya_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nyaya" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://nyaya:nyaya@localhost:5432/nyaya_test
      TEST_DATABASE_URL: postgresql+psycopg://nyaya:nyaya@localhost:5432/nyaya_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python scripts/evaluate.py
